# Vexta — QA, deployed by Dokploy.
#
# Same shape as compose.prod.yaml so that what is tested here is what ships. Only the
# environment name and the image tags differ, the latter so both stacks can share a host.
#
# Domains are NOT declared in this file. They are configured in Dokploy's Domains tab, which
# creates the Traefik router, requests the Let's Encrypt certificate and adds the HTTP→HTTPS
# redirect on its own — so every domain is served over HTTPS without anything to remember here.
# Declaring them here as well would put two routers on the same host, and Dokploy refuses to
# deploy when a domain names a service this file does not define.
#
# WEB_DOMAIN and API_DOMAIN are still required: CORS, the addresses Stripe returns people to,
# and the URL the browser uses to reach the API during social sign-in are all built from them.
#
# Dokploy writes the variables entered in its UI to a .env file beside this one, and compose
# substitutes them below. They are referenced one by one rather than loaded wholesale with
# env_file, so each container receives only what it actually needs and this file doubles as the
# list of what has to be configured.
#
# Run it from the repository root: docker compose -f compose.qa.yaml up -d

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Named per environment, not "vextadb" in both. Two stacks on one machine should
      # not be one typo in a host name away from writing into each other.
      POSTGRES_DB: ${POSTGRES_DB:-vextaqa}
      POSTGRES_USER: ${POSTGRES_USER:-vexta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      # Mounted at /var/lib/postgresql, NOT at .../data. Since Postgres 18 the image keeps its
      # data in a version-specific subdirectory (/var/lib/postgresql/18/docker) so that
      # pg_upgrade --link can work, and it refuses to start when it finds a volume on the old
      # path instead.
      - postgres-data:/var/lib/postgresql
    # Deliberately NOT on dokploy-network: the database has no business being reachable from
    # the proxy's network, where every other application on this host also sits.
    networks:
      vexta-internal:
        # A name of its own. Both stacks run a service called "postgres", so the bare name is
        # ambiguous the moment anything resolving it can see more than one of them.
        aliases:
          - vexta-qa-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vexta} -d ${POSTGRES_DB:-vextaqa}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/Vexta.Api/Dockerfile
    image: vexta/api:qa
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging

      # The Aspire Npgsql component reads this key; "vextadb" is the name the code asks for.
      ConnectionStrings__vextadb: Host=vexta-qa-db;Port=5432;Database=${POSTGRES_DB:-vextaqa};Username=${POSTGRES_USER:-vexta};Password=${POSTGRES_PASSWORD};Include Error Detail=false

      # Signs every session token. Changing it signs everyone out; losing it is harmless.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}

      # Created once, on the first start against an empty database. Never read again afterwards:
      # the seeder skips the whole step as soon as a super admin exists, so changing the password
      # here does not change the account's password.
      SuperAdmin__Email: ${SUPERADMIN_EMAIL:?SUPERADMIN_EMAIL est obligatoire}
      SuperAdmin__Password: ${SUPERADMIN_PASSWORD:?SUPERADMIN_PASSWORD est obligatoire}

      Cors__AllowedOrigins__0: https://${WEB_DOMAIN:?WEB_DOMAIN est obligatoire}
      Frontend__BaseUrl: https://${WEB_DOMAIN}

      # Where the data protection key ring is written. Backed by a volume — see below.
      DataProtection__KeyPath: /data/keys

      # Social sign-in. Left empty, the provider is simply not registered and its button stays
      # hidden, so a deployment without them still works.
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID:-}
      Authentication__Microsoft__ClientSecret: ${MICROSOFT_CLIENT_SECRET:-}
    volumes:
      # The one volume that must never be lost. These keys decrypt the Stripe, Mailgun and R2
      # credentials the super admin saved: without them those rows are unreadable and every
      # integration has to be configured again.
      - api-keys:/data/keys
    networks:
      vexta-internal:
        # THE name this stack's own web container calls, and the reason this block is written
        # out rather than a plain list.
        #
        # Compose registers a DNS alias equal to the service name on EVERY network a service
        # joins. Both stacks define a service called "api" and both join dokploy-network, so on
        # that shared network the name "api" answered for two different containers. Docker
        # round-robins between them, so roughly half of production's calls to http://api:8080
        # were answered by QA's API — which signs tokens with a different key, so the session
        # was rejected with a 401 and the person was signed out at random, and which reads QA's
        # database, which is why the two environments appeared to share their data and why none
        # of it showed up in the right container's log.
        #
        # This alias exists only on vexta-internal, which is private to this stack, so it can
        # never be ambiguous.
        aliases:
          - vexta-qa-api
      # On the proxy's network too: an OAuth provider redirects the browser to the API's
      # callback, and Stripe posts webhooks to it, so it needs a public hostname of its own.
      dokploy-network:
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - 8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/alive"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migrations run before the first request is served, so the first check must wait them out.
      start_period: 90s

  app:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: vexta/app:qa
    restart: unless-stopped
    environment:
      NODE_ENV: production

      # Server-to-server, inside vexta-internal. Plain HTTP is correct here: the traffic never
      # leaves the Docker network, and the API holds no certificate of its own.
      API_INTERNAL_URL: http://vexta-qa-api:8080
      # Where the browser itself is sent, for the one flow that cannot be proxied: an OAuth
      # provider redirects the browser, not our server.
      API_PUBLIC_URL: https://${API_DOMAIN:?API_DOMAIN est obligatoire}

      # Optional. The logo and icon used until the super admin uploads their own, from
      # Apparence. Any URL the browser can reach; leave empty to use the bundled artwork.
      BRANDING_LOGO_LIGHT_URL: ${BRANDING_LOGO_LIGHT_URL:-}
      BRANDING_LOGO_DARK_URL: ${BRANDING_LOGO_DARK_URL:-}
      BRANDING_ICON_URL: ${BRANDING_ICON_URL:-}
    networks:
      vexta-internal:
      dokploy-network:
    depends_on:
      api:
        condition: service_healthy
    expose:
      - 3000

volumes:
  postgres-data:
  api-keys:

networks:
  # Injected by Dokploy. It already exists on the host, which is why it is declared external:
  # compose must attach to it, not create it.
  dokploy-network:
    external: true
  # Private to this stack. Keeps Postgres off the shared proxy network.
  vexta-internal:
    driver: bridge
